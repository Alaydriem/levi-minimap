[workspace]
resolver = "3"
members = ["minimap/core", "minimap/store", "minimap/ui", "minimap/runtime", "minimap/ffi", "minimap/bench", "minimap/link"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
lru = "0.18.5"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wal-db = "1.0.0"
zstd = "0.14.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
crossbeam-channel = "0.5.17"
clipboard-win = "5.4.1"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
tempfile = "3.27.0"
minimap-core = { path = "minimap/core" }
minimap-store = { path = "minimap/store" }
minimap-runtime = { path = "minimap/runtime" }
minimap-ui = { path = "minimap/ui" }
minimap-link = { path = "minimap/link" }
hcl-rs = "=0.19.8"
curia = "=0.2.2"
amm-abi = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
amm-client = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
amm-core = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
amm-ffi = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
levi-ui = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
levi-i18n = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
levi-i18n-tool = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }

[patch."https://github.com/alaydriem/levi-crates"]
amm-abi = { path = "../levi-crates/crates/amm-abi" }
amm-client = { path = "../levi-crates/crates/amm-client" }
amm-core = { path = "../levi-crates/crates/amm-core" }
amm-ffi = { path = "../levi-crates/crates/amm-ffi" }
levi-ui = { path = "../levi-crates/crates/levi-ui" }
levi-i18n = { path = "../levi-crates/crates/levi-i18n" }
levi-i18n-tool = { path = "../levi-crates/crates/levi-i18n-tool" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
