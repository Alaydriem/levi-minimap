[workspace]
resolver = "3"
members = ["minimap/core", "minimap/store", "minimap/ui", "minimap/runtime", "minimap/ffi", "minimap/bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
log = "0.4.34"
lru = "0.18.5"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wal-db = "1.0.0"
zstd = "0.14.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
crossbeam-channel = "0.5.17"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
tempfile = "3.27.0"
minimap-core = { path = "minimap/core" }
minimap-store = { path = "minimap/store" }
minimap-runtime = { path = "minimap/runtime" }
minimap-ui = { path = "minimap/ui" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
