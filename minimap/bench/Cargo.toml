[package]
name = "minimap-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false
autobenches = false
autobins = false

[dependencies]
minimap-core.workspace = true
minimap-runtime.workspace = true
minimap-store.workspace = true
minimap-ui.workspace = true
png.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
egui.workspace = true
levi-ui.workspace = true
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "minimap"
harness = false

[[bin]]
name = "bench-csv"
path = "src/bin/bench_csv.rs"

[[bin]]
name = "capture-tool"
path = "src/bin/capture_tool.rs"

[[bin]]
name = "footprint"
path = "src/bin/footprint.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
