[package]
name = "minimap-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[features]
# the egui test harness, for this crate's tests and the runtime's
test-support = []

[dependencies]
egui.workspace = true
minimap-core.workspace = true
levi-ui.workspace = true
levi-i18n.workspace = true

[dev-dependencies]
minimap-ui = { path = ".", features = ["test-support"] }
levi-i18n-tool.workspace = true
levi-rules.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
