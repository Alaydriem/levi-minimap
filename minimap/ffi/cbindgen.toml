language = "C"
cpp_compat = true
include_guard = "LEVI_MINIMAP_H"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from minimap/ffi. Do not edit: run `mise run header`. */"
documentation = false
style = "both"

after_includes = """
#if defined(_MSC_VER)
#define LM_ALIGNED(n) __declspec(align(n))
#else
#define LM_ALIGNED(n) __attribute__((aligned(n)))
#endif"""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["LmStatus", "LmChunkSurface", "LmColumnSample", "LmProbeRequest", "LmStats"]
[layout]
aligned_n = "LM_ALIGNED"
