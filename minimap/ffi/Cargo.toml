[package]
name = "minimap-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bytemuck.workspace = true
curia.workspace = true
amm-client.workspace = true
amm-core.workspace = true
minimap-core.workspace = true
minimap-link.workspace = true
minimap-runtime.workspace = true
minimap-store.workspace = true

[dev-dependencies]
amm-abi.workspace = true
amm-core.workspace = true
amm-client = { workspace = true, features = ["test-support"] }
amm-ffi.workspace = true
hcl-rs.workspace = true
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

# the real mod manager host, linked in; process-global, so nextest runs each test in its own process
[[test]]
name = "e2e"
path = "tests/e2e.rs"

[lints]
workspace = true
